server:
  port: 8081  #Port
  tomcat:
    uri-encoding: UTF-8   #Service Code
spring:
  profiles:
    active: dev
  application:
    name: auth-service
  cloud:
    nacos:
      config:
        file-extension: yaml
        shared-configs: # Shared Configuration
          - data-id: shared-spring.yaml # Shared Spring Configuration
            refresh: false
          - data-id: shared-redis.yaml # Shared Redis Configuration
            refresh: false
          - data-id: shared-mybatis.yaml # Shared MyBatis Configuration
            refresh: false
          - data-id: shared-logs.yaml # Shared Logging Configuration
            refresh: false
encrypt:
  key-store:
    alias: learnforge  # Alias
    location: classpath:learnforge.jks  #KeyStore Certificate Store Name
    password: tj123321   #Certificate Store Password
    secret: tj123321   #Secret Key
tj:
  swagger:
    enable: true
    enableResponseWrap: true
    package-path: com.learnforge.auth.controller
    title: LearnForge - Identity and Access API
    description: This service is used to manage permission-related information
    contact-name: LearnForge Project
    contact-url: http://www.itcast.cn/
    contact-email: zhanghuyi@itcast.cn
    version: v1.0
  auth:
    resource:
      enable: true
      includeLoginPaths:
        - /menus/me
        - /accounts/logout
  jdbc:
    database: tj_auth
