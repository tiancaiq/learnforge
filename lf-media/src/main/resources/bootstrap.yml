server:
  port: 8084  #Port
  tomcat:
    uri-encoding: UTF-8   #Service Code
spring:
  profiles:
    active: dev
  application:
    name: media-service
  cloud:
    nacos:
      config:
        file-extension: yaml
        shared-configs: # Shared Configuration
          - data-id: shared-spring.yaml # Shared Spring Configuration
            refresh: false
          - data-id: shared-redis.yaml # Shared Redis Configuration
            refresh: false
          - data-id: shared-logs.yaml # Shared Logging Configuration
            refresh: false
          - data-id: shared-mybatis.yaml # Shared MyBatis Configuration
            refresh: false
          - data-id: shared-feign.yaml # Shared Feign Configuration
            refresh: false
tj:
  swagger:
    enable: true
    package-path: com.learnforge.media.controller
    title: LearnForge - Media Service API
    description: This service contains image management, media management, etc.
    contact-name: LearnForge Project
    contact-url: http://www.itcast.cn/
    contact-email: zhanghuyi@itcast.cn
    version: v1.0
    enableResponseWrap: true
  auth:
    resource:
      enable: true
      excludeLoginPaths:
        - /medias/signature/play
  jdbc:
    database: tj_media
  platform:
    file: TENCENT
    media: TENCENT
  tencent:
    appId: 1312394356
    secretId: AKIDDG3arrZ0B42sXzEOM8h182jDVbVDiAPS
    secretKey: uc7RaXIqDPOAk9MAnAG5duvf8LHvIODl
    vod:
      enable: true
      vodValidSeconds: 7776000
      region: "ap-shanghai"
      procedure: "wisehub-base"
      urlKey: "HZFlxjPYoOm5AfShupOx"
      pfcg: "basicDrmPreset"
    cos:
      enable: true
      region: "ap-shanghai"
      bucket: wisehub
      multipartUploadThreshold: 5242880 # 5mb, Threshold for Triggering Chunked Upload
