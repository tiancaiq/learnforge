server:
  port: 8086  #Port
  tomcat:
    uri-encoding: UTF-8   #Service Code
spring:
  profiles:
    active: dev
  application:
    name: course-service
  main:
    allow-circular-references: true
  cloud:
    nacos:
      config:
        file-extension: yaml
        shared-configs: # Shared Configuration
          - data-id: shared-spring.yaml # Shared Spring Configuration
          - data-id: shared-redis.yaml # Shared Redis Configuration
          - data-id: shared-mybatis.yaml # Shared MyBatis Configuration
          - data-id: shared-logs.yaml # Shared Logging Configuration
          - data-id: shared-feign.yaml # Shared Feign Configuration
          - data-id: shared-mq.yaml # Shared MQ Configuration
          - data-id: shared-seata.yaml # Shared Seata Configuration
          - data-id: shared-xxljob.yaml # Shared Seata Configuration
tj:
  swagger:
    enable: true
    package-path: com.learnforge.course.controller
    title: LearnForge - Course Service API
    description: This service contains course management-related functions
    contact-name: LearnForge Project
    contact-url: http://www.itcast.cn/
    contact-email: zhanghuyi@itcast.cn
    version: v1.0
    enableResponseWrap: true
  auth:
    resource:
      enable: false
  jdbc:
    database: tj_course
